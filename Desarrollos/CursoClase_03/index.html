<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Catálogo Interactivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="bg-dark text-white text-center py-5 mb-4">
        <h1 class="display-5 fw-bold">💻 TechStore Catalog</h1>
        <p class="lead mb-0">Encuentra los mejores componentes y accesorios para tu setup.</p>
    </header>

    <main class="container pb-5">
        <!-- Buscador y Filtro -->
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-8">
                        <label for="searchInput" class="form-label fw-semibold">Buscar producto:</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Ej. Teclado, Monitor...">
                    </div>
                    <div class="col-md-4">
                        <label for="categoryFilter" class="form-label fw-semibold">Categoría:</label>
                        <select id="categoryFilter" class="form-select">
                            <option value="Todos">Todos</option>
                            <option value="Periféricos">Periféricos</option>
                            <option value="Pantallas">Pantallas</option>
                            <option value="Audio">Audio</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <div class="row">
            <!-- Catálogo de Productos -->
            <section class="col-lg-8">
                <h2 class="h4 mb-3">Productos Disponibles</h2>
                <div id="productsContainer" class="row">
                    <!-- Los productos se cargan dinámicamente desde JavaScript -->
                </div>
            </section>

            <!-- Carrito de Compras -->
            <aside class="col-lg-4">
                <section class="card shadow-sm position-sticky" style="top: 1rem;">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h5 mb-0">🛒 Tu Carrito</h2>
                    </div>
                    <ul id="cartList" class="list-group list-group-flush">
                        <li class="list-group-item text-center text-muted">El carrito está vacío</li>
                    </ul>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Total: $<span id="cartTotal">0.00</span></span>
                        <button id="clearCartBtn" class="btn btn-outline-danger btn-sm">Vaciar Carrito</button>
                    </div>
                </section>
            </aside>
        </div>
    </main>

    <!-- Toast de confirmación -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div id="toastBody" class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. Datos Base de Productos
        const products = [
            { id: 1, name: "Teclado Mecánico", price: 85.00, category: "Periféricos" },
            { id: 2, name: "Mouse Inalámbrico", price: 45.00, category: "Periféricos" },
            { id: 3, name: "Monitor", price: 190.00, category: "Pantallas" },
            { id: 4, name: "Audífonos", price: 120.00, category: "Audio" },
            { id: 5, name: "Alfombrilla", price: 25.00, category: "Accesorios" }
        ];
        let cart = [];
        // 2. Selección de elementos DOM
        const productsContainer = document.getElementById("productsContainer");
        const searchInput = document.getElementById("searchInput");
        const cartList = document.getElementById("cartList");
        const cartTotal = document.getElementById("cartTotal");
        const clearCartBtn = document.getElementById("clearCartBtn");
        const categoryFilter = document.getElementById("categoryFilter");
        const liveToast = new bootstrap.Toast(document.getElementById("liveToast"));
        const toastBody = document.getElementById("toastBody");
        // 3. Función para Renderizar Productos
        function renderProducts(items) {
            productsContainer.innerHTML = "";
            if (items.length === 0) {
                productsContainer.innerHTML = "<p class=\"text-muted\">No se encontraron productos.</p>";
                return;
            }
            items.forEach(product => {
                const productCard = document.createElement("div");
                productCard.className = "col-md-6 col-xl-4 mb-4";
                productCard.innerHTML = `
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
              <h3 class="h5 card-title">${product.name}</h3>
              <p class="card-text"><span class="badge bg-secondary">${product.category}</span></p>
              <p class="card-text fs-4 fw-bold text-primary">$${product.price.toFixed(2)}</p>
              <button class="btn btn-primary mt-auto" onclick="addToCart(${product.id})">Agregar al Carrito</button>
            </div>
          </div>
        `;
                productsContainer.appendChild(productCard);
            });
        }
        // 4. Función para Agregar al Carrito
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                updateCart();
                showAddedToast(product.name);
            }
        }
        // 5. Actualizar la interfaz del Carrito
        function updateCart() {
            cartList.innerHTML = "";
            if (cart.length === 0) {
                cartList.innerHTML = "<li class=\"list-group-item text-center text-muted\">El carrito está vacío</li>";
                cartTotal.textContent = "0.00";
                return;
            }
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.innerHTML = `
          <span>${item.name} - $${item.price.toFixed(2)}</span>
          <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${index})">Eliminar</button>
        `;
                cartList.appendChild(li);
            });
            cartTotal.textContent = total.toFixed(2);
        }
        // 5b. Eliminar un producto específico del carrito
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }
        // 5c. Mostrar Toast de confirmación
        function showAddedToast(productName) {
            toastBody.textContent = `Producto ${productName} agregado con éxito!`;
            liveToast.show();
        }
        // 6. Función combinada de Búsqueda y Filtro por Categoría
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategory = categoryFilter.value;
            const filteredProducts = products.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchTerm) ||
                    product.category.toLowerCase().includes(searchTerm);
                const matchesCategory = selectedCategory === "Todos" || product.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });
            renderProducts(filteredProducts);
        }
        // 6a. Evento de Búsqueda en Tiempo Real
        searchInput.addEventListener("input", applyFilters);
        // 6b. Evento de Filtro por Categoría
        categoryFilter.addEventListener("change", applyFilters);
        // 7. Evento para Vaciar Carrito
        clearCartBtn.addEventListener("click", () => {
            cart = [];
            updateCart();
        });
        // Carga inicial de productos
        renderProducts(products);
    </script>
</body>
</html>
